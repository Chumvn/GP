<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="description" content="GỬI XE FREE SÀI GÒN – Tổng hợp địa chỉ đỗ xe miễn phí tại TP.HCM">
  <meta name="theme-color" content="#0a0a0b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0a0b' stroke='%2300d4ff' stroke-width='4'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-weight='900' font-size='30' fill='%2300d4ff'%3EGP%3C/text%3E%3C/svg%3E">
  <title>GỬI XE FREE SÀI GÒN</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
  <header class="topbar" role="banner">
    <div class="topbar__left">
      <div class="topbar__logo-text">
        <span class="logo-chum">GỬI XE</span>
        <span class="logo-app">FREE</span>
      </div>
      <span class="topbar__version">SÀI GÒN</span>
    </div>
    <div class="topbar__right">
      <div class="search-wrap">
        <label for="search-input" class="sr-only">Tìm kiếm địa điểm</label>
        <input id="search-input" class="search-input focusable" type="search" placeholder="🔍 Tìm địa chỉ..." autocomplete="off">
      </div>
      <button id="btn-refresh" class="topbar-btn focusable" aria-label="Làm mới" title="Làm mới">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"/><path d="M20.49 15a9 9 0 0 1-14.85 3.36L1 14"/></svg>
      </button>
      <button id="btn-theme" class="topbar-btn focusable" aria-label="Đổi giao diện" title="Đổi giao diện">
        <svg class="icon-moon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="icon-sun" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      </button>
    </div>
  </header>

  <!-- REALTIME STATUS -->
  <div id="realtime-bar" class="realtime-bar"></div>

  <div id="status-line" class="status-line" role="status" aria-live="polite"></div>
  <nav class="tabs-bar" role="tablist" id="tabs-bar"></nav>

  <main id="main-content" class="main-content" role="main">
    <div id="skeleton" class="skeleton-grid">
      <div class="skeleton-card"><div class="sk-icon"></div><div style="flex:1;display:flex;flex-direction:column;gap:8px"><div class="sk-line w80"></div><div class="sk-line w60"></div></div></div>
      <div class="skeleton-card"><div class="sk-icon"></div><div style="flex:1;display:flex;flex-direction:column;gap:8px"><div class="sk-line w80"></div><div class="sk-line w60"></div></div></div>
      <div class="skeleton-card"><div class="sk-icon"></div><div style="flex:1;display:flex;flex-direction:column;gap:8px"><div class="sk-line w80"></div><div class="sk-line w60"></div></div></div>
      <div class="skeleton-card"><div class="sk-icon"></div><div style="flex:1;display:flex;flex-direction:column;gap:8px"><div class="sk-line w80"></div><div class="sk-line w60"></div></div></div>
      <div class="skeleton-card"><div class="sk-icon"></div><div style="flex:1;display:flex;flex-direction:column;gap:8px"><div class="sk-line w80"></div><div class="sk-line w60"></div></div></div>
      <div class="skeleton-card"><div class="sk-icon"></div><div style="flex:1;display:flex;flex-direction:column;gap:8px"><div class="sk-line w80"></div><div class="sk-line w60"></div></div></div>
    </div>
    <div id="cards-grid" class="cards-grid" role="list" style="display:none"></div>
    <div id="empty-state" class="empty-state" style="display:none">
      <p class="empty-state__text">Không tìm thấy địa điểm nào.</p>
    </div>
  </main>

  <div id="toast" class="toast" role="alert" aria-live="assertive" style="display:none"></div>
  <script src="./app.js"></script>
</body>
</html>
