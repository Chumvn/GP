<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#0a0a0b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0a0b' stroke='%2300d4ff' stroke-width='4'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-weight='900' font-size='30' fill='%2300d4ff'%3EGP%3C/text%3E%3C/svg%3E">
  <title>GỬI XE SÀI GÒN</title>
  <link rel="stylesheet" href="./style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
  <header class="topbar">
    <div class="topbar__left">
      <span class="logo-a">GỬI XE</span>
      <span class="logo-b">SÀI GÒN</span>
    </div>
    <div class="topbar__right">
      <input id="search" class="search-input" type="search" placeholder="🔍 Tìm..." autocomplete="off">
      <button id="btn-add" class="topbar-btn btn-add" title="Thêm chỗ đậu">＋</button>
      <button id="btn-theme" class="topbar-btn" title="Đổi theme">🌙</button>
    </div>
  </header>
  <div id="rt-bar" class="rt-bar"></div>
  <nav id="tabs" class="tabs-bar"></nav>
  <main class="main">
    <div id="empty" class="empty">
      <p style="font-size:2.5rem">🅿️</p>
      <p class="empty-t">Chưa có chỗ đậu xe nào</p>
      <p class="empty-s">Bấm <b>＋</b> để thêm địa điểm mới</p>
    </div>
    <div id="grid" class="cards-grid" style="display:none"></div>
  </main>
  <div id="toast" class="toast"></div>
  <script src="./app.js"></script>
</body>
</html>
